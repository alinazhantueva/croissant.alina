<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Круассан | Мир выпечки</title>
   <link rel="stylesheet" href="css.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="!DOCTYPE Алина.html" class="logo">Croissant</a>
            <nav>
                <ul>
                    <li><a href="index.html">О нас</a></li>
                    <li><a href="Gallery.html">Галерея</a></li>
                    <li><a href="Menu.html">Меню</a></li>
                    <li><a href="Contact.html">Связаться</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section id="Gallery.html" class="slider-section">
        <div class="container">
            <h2>Галерея шедевров</h2>           
            <div class="css-slider">
                <input type="radio" name="slider" id="slide1" checked>
                <input type="radio" name="slider" id="slide2">
                <input type="radio" name="slider" id="slide3">
                <div class="slider-track">
                    <div class="slide">
                        <img src="торт.jpg" alt="Шоколадный бум">
                        <div class="slide-caption">«Шоколадный бум» (Торт), 1931</div>
                    </div>
                    <div class="slide">
                        <img src="чизкейк.jpg" alt="Голубично - малиновый пейзаж">
                        <div class="slide-caption">«Голубично - малиновый пейзаж», 1948 (Чизкейк)</div>
                    </div>
                    <div class="slide">
                        <img src="Круассан.jpg" alt="Французский круассан">
                        <div class="slide-caption">«Французский круассан», 1952 (Круассан)</div>
                    </div>
                </div>
                <div class="slider-nav">
                    <label for="slide1"></label>
                    <label for="slide2"></label>
                    <label for="slide3"></label>
                </div>
            </div>
            
        </div>
    </section>
